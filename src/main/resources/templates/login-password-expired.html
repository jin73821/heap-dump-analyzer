<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/common.css?v=2026-08-11">
    <title>비밀번호 변경 — Heap Dump Analyzer</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px 36px;
                      width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
                      justify-content: center; }
        .login-logo-icon { width: 40px; height: 40px; background: #D97706; border-radius: 10px;
                           display: flex; align-items: center; justify-content: center; }
        
        .login-sub { text-align: center; font-size: 13px; color: #6B7280; margin-bottom: 6px; }
        .otp-user { text-align: center; font-size: 13px; font-weight: 700; color: #1F2937; margin-bottom: 18px; }
        .msg-error { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626;
                     padding: 10px 14px; border-radius: 8px; font-size: 13px;
                     margin-bottom: 16px; text-align: center; }
        .msg-warn { background: #FFF7ED; border: 1px solid #FED7AA; color: #C2410C;
                    padding: 10px 14px; border-radius: 8px; font-size: 12.5px;
                    margin-bottom: 16px; text-align: center; line-height: 1.5; }
        .fld { margin-bottom: 12px; }
        .fld-label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
        .pw-input { width: 100%; padding: 11px 13px; border: 1px solid #E5E7EB;
                    border-radius: 8px; font-size: 14px; outline: none; background: #F9FAFB; }
        .pw-input:focus { border-color: #93C5FD; box-shadow: 0 0 0 3px rgba(37,99,235,.1); background: #fff; }
        .pw-hint { font-size: 11.5px; color: #9CA3AF; margin-top: 10px; line-height: 1.5; }
        .pw-mismatch { color: #DC2626; font-size: 11.5px; margin-top: 4px; display: none; }
        .login-btn { width: 100%; padding: 11px; border: none; border-radius: 8px;
                     background: #2563EB; color: #fff; font-size: 14px; font-weight: 600;
                     cursor: pointer; margin-top: 14px; position: relative; transition: background .15s; }
        
        
        @keyframes loginSpin { to { transform: rotate(360deg); } }
        

        @media (max-width: 480px) {
            body { padding: 24px; align-items: flex-start; padding-top: 48px; }
            .login-card { padding: 24px 18px; border-radius: 12px; max-width: 340px;
                          box-shadow: 0 2px 12px rgba(0,0,0,.06); margin: 0 auto; }
            .login-logo { gap: 8px; margin-bottom: 14px; }
            .login-logo-icon { width: 30px; height: 30px; border-radius: 7px; }
            .login-logo-icon svg { width: 17px; height: 17px; }
            .login-logo-text { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <div class="login-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        </div>
        <span class="login-logo-text">비밀번호 변경 필요</span>
    </div>
    <div class="login-sub">비밀번호 유효기간이 만료되었습니다.</div>
    <div class="otp-user" th:text="${username}"></div>

    <div class="msg-warn">
        보안 정책에 따라 <b th:text="${expiryDays}">90</b>일마다 비밀번호를 변경해야 합니다.<br>
        새 비밀번호로 변경해야 계속 이용할 수 있습니다.
    </div>

    <div th:if="${errorMessage}" class="msg-error" th:text="${errorMessage}"></div>

    <form th:action="@{/login/password}" method="post" id="pwForm" autocomplete="off">
        <div class="fld">
            <label class="fld-label" for="currentPassword">현재 비밀번호</label>
            <input class="pw-input" type="password" id="currentPassword" name="currentPassword"
                   autocomplete="current-password" required autofocus>
        </div>
        <div class="fld">
            <label class="fld-label" for="newPassword">새 비밀번호</label>
            <input class="pw-input" type="password" id="newPassword" name="newPassword"
                   autocomplete="new-password" required>
        </div>
        <div class="fld" style="margin-bottom:0">
            <label class="fld-label" for="confirmPassword">새 비밀번호 확인</label>
            <input class="pw-input" type="password" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required>
            <div class="pw-mismatch" id="pwMismatch">새 비밀번호가 일치하지 않습니다.</div>
        </div>
        <button class="login-btn" type="submit" id="pwSubmit" disabled>비밀번호 변경</button>
    </form>
    <div class="pw-hint">최소 8자 이상 &middot; 영문/숫자/특수문자 각각 1자 이상 포함 &middot; 현재 비밀번호와 달라야 합니다.</div>
    <div class="switch-row">
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="switch-link">다른 계정으로 로그인</button>
        </form>
    </div>
</div>

<script>
(function () {
    var cur = document.getElementById('currentPassword');
    var np  = document.getElementById('newPassword');
    var cp  = document.getElementById('confirmPassword');
    var btn = document.getElementById('pwSubmit');
    var mismatch = document.getElementById('pwMismatch');
    var form = document.getElementById('pwForm');
    if (!form) return;

    function validate() {
        var filled = cur.value.length > 0 && np.value.length >= 8 && cp.value.length > 0;
        var match = np.value === cp.value;
        if (cp.value.length > 0) mismatch.style.display = match ? 'none' : 'block';
        else mismatch.style.display = 'none';
        btn.disabled = !(filled && match);
    }
    [cur, np, cp].forEach(function (el) { el.addEventListener('input', validate); });
    form.addEventListener('submit', function () { btn.classList.add('loading'); });
})();
</script>

</body>
</html>
