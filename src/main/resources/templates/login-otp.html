<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/common.css?v=2026-08-12">
    <title>2차인증 — Heap Dump Analyzer</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px 36px;
                      width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
                      justify-content: center; }
        .login-logo-icon { width: 40px; height: 40px; background: #2563EB; border-radius: 10px;
                           display: flex; align-items: center; justify-content: center; }
        
        .login-sub { text-align: center; font-size: 13px; color: #6B7280; margin-bottom: 8px; }
        .otp-user { text-align: center; font-size: 13px; font-weight: 700; color: #1F2937; margin-bottom: 20px; }
        .msg-error { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626;
                     padding: 10px 14px; border-radius: 8px; font-size: 13px;
                     margin-bottom: 16px; text-align: center; }
        .msg-warn { background: #FFF7ED; border: 1px solid #FED7AA; color: #C2410C;
                    padding: 10px 14px; border-radius: 8px; font-size: 13px;
                    margin-bottom: 16px; text-align: center; }
        .otp-input { width: 100%; padding: 12px 14px; border: 1px solid #E5E7EB;
                     border-radius: 8px; font-size: 26px; outline: none; background: #F9FAFB;
                     text-align: center; letter-spacing: 12px; font-weight: 700;
                     font-family: 'SF Mono', Consolas, monospace; }
        .otp-input:focus { border-color: #93C5FD; box-shadow: 0 0 0 3px rgba(37,99,235,.1);
                           background: #fff; }
        .login-btn { width: 100%; padding: 11px; border: none; border-radius: 8px;
                     background: #2563EB; color: #fff; font-size: 14px; font-weight: 600;
                     cursor: pointer; margin-top: 14px; position: relative; transition: background .15s; }
        
        
        @keyframes loginSpin { to { transform: rotate(360deg); } }
        .otp-hint { text-align: center; font-size: 12px; color: #9CA3AF; margin-top: 12px; }
        

        @media (max-width: 480px) {
            body { padding: 24px; align-items: flex-start; padding-top: 60px; }
            .login-card { padding: 24px 18px; border-radius: 12px; max-width: 320px;
                          box-shadow: 0 2px 12px rgba(0,0,0,.06); margin: 0 auto; }
            .login-logo { gap: 8px; margin-bottom: 14px; }
            .login-logo-icon { width: 30px; height: 30px; border-radius: 7px; }
            .login-logo-icon svg { width: 17px; height: 17px; }
            .login-logo-text { font-size: 15px; }
            .otp-input { font-size: 22px; letter-spacing: 9px; }
            .msg-error, .msg-warn { font-size: 11px; padding: 8px 10px; }
        }
        @media (min-width: 1024px) {
            .login-card { padding: 48px 44px; max-width: 420px; }
            .login-logo-text { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <div class="login-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <span class="login-logo-text">2차인증 (OTP)</span>
    </div>
    <div class="login-sub">Authenticator 앱에 표시된 6자리 코드를 입력하세요</div>
    <div class="otp-user" th:text="${username}"></div>

    <div th:if="${errorMessage}" class="msg-error" th:text="${errorMessage}"></div>
    <div th:if="${remain != null and remain le 3}" class="msg-warn">
        &#9888; <b th:text="${remain}"></b>회 더 실패하면 계정이 잠깁니다. 관리자 문의 전 앱 시간 동기화를 확인하세요.
    </div>

    <form th:action="@{/login/otp}" method="post" id="otpForm">
        <input class="otp-input" type="text" id="code" name="code"
               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
               maxlength="6" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autofocus required>
        <button class="login-btn" type="submit" id="otpSubmit" disabled>확인</button>
    </form>
    <div class="otp-hint">6자리를 입력한 뒤 <b>확인</b>을 눌러 인증하세요 &middot; 10회 연속 실패 시 계정이 잠깁니다</div>
    <div class="switch-row">
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="switch-link">다른 계정으로 로그인</button>
        </form>
    </div>
</div>

<script>
(function () {
    try {
        if (window.history && window.history.replaceState && location.search.indexOf('error') >= 0) {
            window.history.replaceState({}, document.title, location.pathname);
        }
    } catch (e) {
        /* 구형 브라우저 — 주소창에 파라미터가 남을 뿐 인증에는 지장이 없다 */
        if (window.console && console.debug) console.debug('[LoginOtp] 주소 정리 실패(history 미지원):', e.message || e);
    }
})();

(function () {
    var codeEl = document.getElementById('code');
    var formEl = document.getElementById('otpForm');
    var btnEl  = document.getElementById('otpSubmit');
    if (!codeEl || !formEl) return;
    // 숫자만 허용. 자동 제출하지 않음(오입력으로 인한 시도 소진 방지) — 6자리일 때만 확인 버튼 활성화.
    codeEl.addEventListener('input', function () {
        codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 6);
        if (btnEl) btnEl.disabled = codeEl.value.length !== 6;
    });
    formEl.addEventListener('submit', function () {
        if (btnEl) btnEl.classList.add('loading');
    });
})();
</script>

</body>
</html>
